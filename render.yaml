# Deploy on Render: use a persistent disk so entries survive redeploys.
# Free tier = ephemeral disk only (data lost on each deploy). Use Starter + disk below.
#
# Connect GitHub → New Web Service → Docker → Dockerfile.cloud

services:
  - type: web
    name: voice-journal
    runtime: docker
    plan: starter
    rootDir: .
    dockerfilePath: ./Dockerfile.cloud
    healthCheckPath: /health
    disk:
      name: voice-journal-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: WHISPER_PROVIDER
        value: openai
      - key: EMBED_PROVIDER
        value: openai
      - key: WHISPER_MODEL
        value: whisper-1
      - key: LLM_PROVIDER
        value: openai
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /data
      - key: PERSISTENT_DISK
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: PASSCODE_HASH
        sync: false
      - key: PUBLIC_URL
        sync: false
