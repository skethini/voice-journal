# Deploy on Render (free tier available): https://render.com
# Connect this GitHub repo → New Web Service → Docker → Dockerfile.cloud
#
# Or paste env vars in the Render dashboard from .env.example.cloud

services:
  - type: web
    name: voice-journal
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile.cloud
    healthCheckPath: /health
    envVars:
      - key: WHISPER_PROVIDER
        value: openai
      - key: EMBED_PROVIDER
        value: openai
      - key: WHISPER_MODEL
        value: whisper-1
      - key: LLM_PROVIDER
        value: openai
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: PASSCODE_HASH
        sync: false
      - key: PUBLIC_URL
        sync: false
